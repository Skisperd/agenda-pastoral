name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  patrol-web:
    name: Patrol (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub global activate patrol_cli
      - run: >
          patrol test -t integration_test/agendamento_test.dart
          --device chrome --web-headless --web-locale pt-BR
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: patrol-report
          path: playwright-report/

  firestore-rules:
    name: Regras do Firestore (emulador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore_tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test

  deploy:
    name: Publicar no Firebase
    # Só no main, depois de todos os testes passarem.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flutter, patrol-web, firestore-rules]
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Verificar chave
        id: key
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Segredo FIREBASE_SERVICE_ACCOUNT não cadastrado; publicação pulada (ver docs/FIREBASE.md)."
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ok == 'true'
        with:
          channel: stable
          cache: true
      - name: Gerar o app web
        if: steps.key.outputs.ok == 'true'
        run: flutter build web --release
      - name: Publicar regras do Firestore e o site
        if: steps.key.outputs.ok == 'true'
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx --yes firebase-tools@15 deploy --only firestore,hosting --non-interactive
