name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Análise e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Versão do Flutter (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Compila a versão web
        run: flutter build web --release

  firestore-rules:
    name: Regras do Firestore (emulador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore_tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test

  deploy:
    name: Publicar no Firebase
    # Só no main, depois de todos os testes passarem.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [flutter, firestore-rules]
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Verificar chave
        id: key
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Segredo FIREBASE_SERVICE_ACCOUNT não cadastrado; publicação pulada (ver docs/FIREBASE.md)."
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - name: Versão do Flutter (.fvmrc)
        if: steps.key.outputs.ok == 'true'
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ok == 'true'
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - name: Gerar o app web
        if: steps.key.outputs.ok == 'true'
        run: flutter build web --release
      - name: Publicar regras do Firestore e o site
        if: steps.key.outputs.ok == 'true'
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx --yes firebase-tools@15 deploy --only firestore,hosting --non-interactive
