<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- viewport-fit=cover: o iOS passa a informar a área segura (indicador de início, notch) e o app afasta a barra de menus dela. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Membros, agenda pastoral, agenda da igreja, eventos e escala diaconal da Igreja Cristã Presbiteriana Pedras Vivas">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#223776">
  <meta name="apple-mobile-web-app-title" content="Pedras Vivas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pedras Vivas · Igreja</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Sondas da área segura do iOS (lidas pelo app em lib/core/platform/safe_area_web.dart). -->
  <style>
    #safe-top, #safe-bottom { position: fixed; left: 0; width: 1px; pointer-events: none; visibility: hidden; }
    #safe-top { top: 0; height: env(safe-area-inset-top, 0px); }
    #safe-bottom { bottom: 0; height: env(safe-area-inset-bottom, 0px); }
  </style>
  <div id="safe-top"></div>
  <div id="safe-bottom"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
