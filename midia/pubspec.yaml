name: midia_pedras_vivas
description: "Equipa de mídia da Pedras Vivas: OBS, telão, câmeras e mensagens no culto"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  url_launcher: ^6.3.3
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  web: ^1.1.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-500.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-600.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-700.ttf
          weight: 700
